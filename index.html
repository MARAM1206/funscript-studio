<!-- 🧠 IA DIRECTOR (NUEVO PANEL ACTUALIZADO) -->
        <div id="panel-director" class="workspace-panel" data-title="🧠 IA Director">
            <div class="panel-header" style="padding: 6px 12px; cursor: move; border-bottom: 1px solid #1e293b; display:flex; justify-content: flex-start; align-items: center;">
                <span style="font-weight: bold; font-size: 0.8rem; color:#94a3b8;">🧠 Inteligencia Artificial</span>
            </div>
            <div class="panel-content" style="display: flex; flex-direction: column; justify-content: flex-start; align-items: center; padding: 15px; overflow-y: auto;">
                
                <div style="width: 100%; margin-bottom: 10px;">
                    <label style="font-size: 0.7rem; font-weight: bold; color:#e2e8f0; display:block; margin-bottom: 4px;">Prompt de la Escena (Opcional):</label>
                    <textarea id="director-prompt" rows="2" style="width: 100%; padding: 6px; background: #020617; color: #38bdf8; border: 1px solid #1e293b; border-radius: 6px; outline: none; font-size: 0.75rem; resize: none; font-family: monospace;" placeholder="Ej: Blowjob con garganta profunda, luego sentones y termina con edging..."></textarea>
                </div>

                <div style="display: flex; gap: 10px; width: 100%; margin-bottom: 15px;">
                    <div style="flex-grow: 1;">
                        <label style="font-size: 0.7rem; font-weight: bold; color:#e2e8f0; display:block; margin-bottom: 4px;">Intensidad Global:</label>
                        <select id="director-speed-select" style="width: 100%; padding: 4px; background: #0f172a; color: #e2e8f0; border: 1px solid #1e293b; border-radius: 6px; outline: none; font-size: 0.75rem;">
                            <option value="random">🎲 Aleatorio</option>
                            <option value="slow">🟢 Lento</option>
                            <option value="medium">🟡 Medio</option>
                            <option value="fast">🟠 Rápido</option>
                            <option value="very_fast">🔴 Muy Ráp.</option>
                        </select>
                    </div>
                    <div style="flex-grow: 1;">
                        <label style="font-size: 0.7rem; font-weight: bold; color:#e2e8f0; display:block; margin-bottom: 4px;">Tu Aguante:</label>
                        <select id="director-stamina" style="width: 100%; padding: 4px; background: #0f172a; color: #e2e8f0; border: 1px solid #1e293b; border-radius: 6px; outline: none; font-size: 0.75rem;">
                            <option value="low">😅 No duro mucho</option>
                            <option value="normal" selected>🙂 Normal</option>
                            <option value="high">🥵 Aguanto demasiado</option>
                        </select>
                    </div>
                </div>

                <div style="width: 100%; margin-bottom: 15px;">
                    <div style="display: flex; justify-content: space-between; font-size: 0.7rem; color: #e2e8f0; margin-bottom: 5px;">
                        <span>Duración a Generar:</span> <span id="director-dur-val" style="color: #38bdf8; font-weight: bold;">Todo el Video</span>
                    </div>
                    <input type="range" id="director-dur-slider" class="volume-slider" style="width: 100%;" min="0" max="60" step="1" value="0">
                    <span style="font-size:0.6rem; color:#64748b; display:block; margin-top:4px;">(0 = Usa la duración del reproductor)</span>
                </div>

                <button id="director-generate-btn" class="menu-btn orange-btn" style="width: 100%; margin-top: auto; font-weight: bold; padding: 8px;">🎬 Crear Guion Inteligente</button>
            </div>
        </div>
